pacts:
  glass_cannon:
    display_name: "&cGlass Cannon"
    cost_health: 10.0 # Reduces 5 hearts (Base health is 20.0)
    permission: "soulledger.pact.glasscannon"
    icon: DIAMOND_SWORD
    effects:
      - "INCREASE_DAMAGE:2" # Strength 3 (0-indexed)
      - "SPEED:1"           # Speed 2
  tank_soul:
    display_name: "&9Steel Soul"
    cost_health: 6.0 # Reduces 3 hearts
    permission: "soulledger.pact.tanksoul"
    icon: IRON_CHESTPLATE
    effects:
      - "DAMAGE_RESISTANCE:1"
      - "SLOW:0"

